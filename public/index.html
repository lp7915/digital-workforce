<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>数字员工工作台</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2040%2040%22%20fill%3D%22none%22%3E%3Crect%20width%3D%2240%22%20height%3D%2240%22%20rx%3D%2212%22%20fill%3D%22%2325272D%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%2210%22%20width%3D%229%22%20height%3D%2220%22%20rx%3D%224.5%22%20fill%3D%22%23F5F3EE%22%2F%3E%3Crect%20x%3D%2222%22%20y%3D%2210%22%20width%3D%229%22%20height%3D%2212%22%20rx%3D%224.5%22%20fill%3D%22%23C5BADF%22%2F%3E%3Ccircle%20cx%3D%2226.5%22%20cy%3D%2227%22%20r%3D%224%22%20fill%3D%22%23A8D4C3%22%2F%3E%3C%2Fsvg%3E"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <aside>
        <a class="brand" href="#employees"
          ><img
            src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2040%2040%22%20fill%3D%22none%22%3E%3Crect%20width%3D%2240%22%20height%3D%2240%22%20rx%3D%2212%22%20fill%3D%22%2325272D%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%2210%22%20width%3D%229%22%20height%3D%2220%22%20rx%3D%224.5%22%20fill%3D%22%23F5F3EE%22%2F%3E%3Crect%20x%3D%2222%22%20y%3D%2210%22%20width%3D%229%22%20height%3D%2212%22%20rx%3D%224.5%22%20fill%3D%22%23C5BADF%22%2F%3E%3Ccircle%20cx%3D%2226.5%22%20cy%3D%2227%22%20r%3D%224%22%20fill%3D%22%23A8D4C3%22%2F%3E%3C%2Fsvg%3E"
            alt=""
            width="34"
            height="34"
          /><span>数字员工<small>WORKSPACE</small></span></a
        >
        <nav aria-label="主导航">
          <div class="workspace-label">数字员工</div>
          <a href="#employees" data-nav="employees"><span aria-hidden="true">◈</span>数字员工</a>
          <a href="#tasks" data-nav="tasks"><span aria-hidden="true">◷</span>运行中的任务</a>
          <div class="workspace-label">协作</div>
          <a href="#projects" data-nav="projects"><span aria-hidden="true">▦</span>项目</a>
          <a href="#groups" data-nav="groups"><span aria-hidden="true">☏</span>群聊</a>
        </nav>
        <div class="sidebar-foot">
          <span class="status-dot"></span>本机工作台
          <p>记忆存储于 MA</p>
        </div>
      </aside>
      <div class="main-shell">
        <header>
          <div id="breadcrumb">工作空间</div>
          <div class="header-right">
            <button
              type="button"
              data-action="ma-config"
              class="service-config"
              aria-label="配置方舟服务"
              title="配置方舟服务"
            >
              <span id="ma-status" class="pill" role="status">正在读取方舟状态</span>
              <svg
                aria-hidden="true"
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              >
                <path d="M4 7h9m4 0h3M4 17h3m4 0h9" />
                <circle cx="15" cy="7" r="2" />
                <circle cx="9" cy="17" r="2" />
              </svg>
            </button>
            <span id="workspace-status" class="pill" role="status">正在连接本机服务</span>
          </div>
        </header>
        <main id="content"></main>
      </div>
    </div>
    <div id="toast" role="status" hidden></div>
    <dialog id="modal" aria-labelledby="modal-title">
      <button type="button" data-action="close" class="dialog-close" aria-label="关闭">×</button>
      <div id="modal-content"></div>
    </dialog>
    <script src="/app.js" defer></script>
  </body>
</html>
