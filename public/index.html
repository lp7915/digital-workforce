<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title> · 数字员工工作台</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <aside>
        <a class="brand" href="#employees">数字员工</a>
        <div class="workspace-label">工作空间</div>
        <nav aria-label="主导航">
          <a href="#employees" data-nav="employees"><span aria-hidden="true">◈</span>数字员工</a>
          <a href="#projects" data-nav="projects"><span aria-hidden="true">▦</span>项目</a>
          <a href="#observations" data-nav="observations"><span aria-hidden="true">◷</span>观测</a>
        </nav>
        <div class="sidebar-foot">
          <span class="status-dot"></span>前端演示
          <p>数据仅保存在当前浏览器</p>
        </div>
      </aside>
      <div class="main-shell">
        <header>
          <div id="breadcrumb">工作空间</div>
          <div class="header-right"><span class="pill">演示模式 · 未连接后端</span></div>
        </header>
        <main id="content"></main>
      </div>
    </div>
    <div id="toast" role="status" hidden></div>
    <dialog id="modal" aria-labelledby="modal-title">
      <button type="button" data-action="close" class="dialog-close" aria-label="关闭">×</button>
      <div id="modal-content"></div>
    </dialog>
    <script src="/app.js" defer></script>
  </body>
</html>
