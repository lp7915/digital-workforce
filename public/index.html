<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title> · 数字员工工作台</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <aside>
        <a class="brand" href="#employees">数字员工</a>
        <nav aria-label="主导航">
          <div class="workspace-label">数字员工</div>
          <a href="#employees" data-nav="employees"><span aria-hidden="true">◈</span>数字员工</a>
          <a href="#tasks" data-nav="tasks"><span aria-hidden="true">◷</span>运行中的任务</a>
          <div class="workspace-label">协作</div>
          <a href="#projects" data-nav="projects"><span aria-hidden="true">▦</span>项目</a>
          <a href="#groups" data-nav="groups"><span aria-hidden="true">☏</span>群聊</a>
        </nav>
        <div class="sidebar-foot">
          <span class="status-dot"></span>本机工作台
          <p>数据保存在本机 SQLite</p>
        </div>
      </aside>
      <div class="main-shell">
        <header>
          <div id="breadcrumb">工作空间</div>
          <div class="header-right">
            <button type="button" data-action="ma-config">方舟配置</button>
            <span id="ma-status" class="pill" role="status">正在读取方舟状态</span>
            <span id="workspace-status" class="pill">正在连接本机服务</span>
          </div>
        </header>
        <main id="content"></main>
      </div>
    </div>
    <div id="toast" role="status" hidden></div>
    <dialog id="modal" aria-labelledby="modal-title">
      <button type="button" data-action="close" class="dialog-close" aria-label="关闭">×</button>
      <div id="modal-content"></div>
    </dialog>
    <script src="/app.js" defer></script>
  </body>
</html>
